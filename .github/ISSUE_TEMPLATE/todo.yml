name: TODO
description: Track a project maintenance task - 记录项目维护任务
title: "[TODO] "
body:
  - type: markdown
    attributes:
      value: |
        For project maintainers to track planned work. Please use Bug Report or Feature Request for user feedback.
        此模板供项目维护者记录计划工作；用户反馈请使用 Bug 反馈或功能请求模板。

  - type: input
    id: task
    attributes:
      label: Task - 待办事项
    validations:
      required: true

  - type: textarea
    id: details
    attributes:
      label: Details and acceptance criteria - 任务详情与验收标准
      description: Describe the work and how to determine that it is complete. - 请说明需要完成的工作及完成标准。
    validations:
      required: false
